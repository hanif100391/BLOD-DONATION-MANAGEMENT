<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blood Donation Management</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
  }
  h2 {
    background-color: #f44336;
    color: white;
    padding: 10px;
  }
  form {
    margin-bottom: 30px;
    border: 1px solid #ccc;
    padding: 15px;
  }
  input, select {
    margin: 5px 0;
    padding: 8px;
    width: 100%;
  }
  button {
    background-color: #4CAF50;
    color: white;
    padding: 10px 15px;
    border: none;
    cursor: pointer;
  }
  #matches, #donorList {
    margin-top: 20px;
  }
  .match-item, .donor-item {
    border: 1px solid #ccc;
    padding: 10px;
    margin-bottom: 10px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
  }
  table, th, td {
    border: 1px solid #aaa;
  }
  th, td {
    padding: 8px;
    text-align: center;
  }
</style>
</head>
<body>

<h2>Register as Blood Donor</h2>
<form id="donorForm">
  <label>Name:</label>
  <input type="text" id="donorName" required />
  
  <label>Blood Group:</label>
  <select id="bloodGroup" required>
    <option value="">Select</option>
    <option value="A+">A+</option>
    <option value="A-">A-</option>
    <option value="B+">B+</option>
    <option value="B-">B-</option>
    <option value="O+">O+</option>
    <option value="O-">O-</option>
    <option value="AB+">AB+</option>
    <option value="AB-">AB-</option>
  </select>
  
  <label>Division (Location):</label>
  <select id="donorLocation" required>
    <option value="">Select</option>
    <option value="DHAKA">DHAKA</option>
    <option value="KHULNA">KHULNA</option>
    <option value="BARISHAL">BARISHAL</option>
    <option value="CHATTAGRAM">CHATTAGRAM</option>
    <option value="MYMENSINGH">MYMENSINGH</option>
    <option value="RAJSHAHI">RAJSHAHI</option>
    <option value="RANGPUR">RANGPUR</option>
    <option value="SYLHET">SYLHET</option>
  </select>
  
  <label>Contact Number:</label>
  <input type="text" id="donorContact" required />
  <button type="submit">Register</button>
</form>

<h2>Request Blood</h2>
<form id="requestForm">
  <label>Name:</label>
  <input type="text" id="requestName" required />
  
  <label>Blood Group Needed:</label>
  <select id="requestBloodGroup" required>
    <option value="">Select</option>
    <option value="A+">A+</option>
    <option value="A-">A-</option>
    <option value="B+">B+</option>
    <option value="B-">B-</option>
    <option value="O+">O+</option>
    <option value="O-">O-</option>
    <option value="AB+">AB+</option>
    <option value="AB-">AB-</option>
  </select>
  
  <label>Division (Location):</label>
  <select id="requestLocation" required>
    <option value="">Select</option>
    <option value="DHAKA">DHAKA</option>
    <option value="KHULNA">KHULNA</option>
    <option value="BARISHAL">BARISHAL</option>
    <option value="CHATTAGRAM">CHATTAGRAM</option>
    <option value="MYMENSINGH">MYMENSINGH</option>
    <option value="RAJSHAHI">RAJSHAHI</option>
    <option value="RANGPUR">RANGPUR</option>
    <option value="SYLHET">SYLHET</option>
  </select>
  
  <button type="submit">Request</button>
</form>

<h2>Matching Donors</h2>
<div id="matches"></div>

<h2>All Registered Donors</h2>
<div id="donorList"></div>

<script>
  // Load existing donors from localStorage or initialize
  let donors = JSON.parse(localStorage.getItem('donors')) || [];

  function saveDonors() {
    localStorage.setItem('donors', JSON.stringify(donors));
  }

  // Display all donors publicly
  function showAllDonors() {
    const donorListDiv = document.getElementById('donorList');
    donorListDiv.innerHTML = "";

    if (donors.length === 0) {
      donorListDiv.innerHTML = "<p>No donors registered yet.</p>";
      return;
    }

    let table = "<table><tr><th>Name</th><th>Blood Group</th><th>Division</th><th>Contact</th><th>Registered At</th></tr>";
    donors.forEach(donor => {
      table += `<tr>
                  <td>${donor.name}</td>
                  <td>${donor.bloodGroup}</td>
                  <td>${donor.location}</td>
                  <td>${donor.contact}</td>
                  <td>${donor.registeredAt}</td>
                </tr>`;
    });
    table += "</table>";
    donorListDiv.innerHTML = table;
  }

  // Register donor (multiple entries allowed)
  document.getElementById('donorForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const name = document.getElementById('donorName').value.trim();
    const bloodGroup = document.getElementById('bloodGroup').value;
    const location = document.getElementById('donorLocation').value;
    const contact = document.getElementById('donorContact').value.trim();

    donors.push({ 
      name, 
      bloodGroup, 
      location, 
      contact, 
      registeredAt: new Date().toLocaleString() 
    });

    saveDonors();
    showAllDonors();
    alert('Donor registered successfully!');
    this.reset();
  });

  // Handle blood request
  document.getElementById('requestForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const name = document.getElementById('requestName').value.trim();
    const bloodGroup = document.getElementById('requestBloodGroup').value;
    const location = document.getElementById('requestLocation').value;

    matchDonors(bloodGroup, location);
    alert('Blood request submitted!');
    this.reset();
  });

  // Match donors based on blood group and location
  function matchDonors(bloodGroup, location) {
    const matched = donors.filter(donor => 
      donor.bloodGroup === bloodGroup && donor.location === location
    );

    const matchesDiv = document.getElementById('matches');
    matchesDiv.innerHTML = '';

    if (matched.length === 0) {
      matchesDiv.innerHTML = '<p>No matching donors found.</p>';
    } else {
      matched.forEach(donor => {
        const div = document.createElement('div');
        div.className = 'match-item';
        div.innerHTML = `<strong>Name:</strong> ${donor.name} <br />
                         <strong>Blood Group:</strong> ${donor.bloodGroup} <br />
                         <strong>Division:</strong> ${donor.location} <br />
                         <strong>Contact Number:</strong> ${donor.contact} <br />
                         <strong>Registered At:</strong> ${donor.registeredAt} <br />
                         <strong>Status:</strong> Please contact immediately!`;
        matchesDiv.appendChild(div);
      });
    }
  }

  // Show donors on page load
  showAllDonors();
</script>

</body>
</html>
