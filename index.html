<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blood Donation Management</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; }
    h1, h2 { color: #b30000; }
    .section { background: #fff; padding: 15px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
    label { display: block; margin-top: 10px; }
    input, select, button { margin-top: 5px; padding: 8px; width: 100%; border-radius: 5px; border: 1px solid #ccc; }
    button { background: #b30000; color: #fff; cursor: pointer; }
    button:hover { background: #800000; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    table, th, td { border: 1px solid #ccc; }
    th, td { padding: 8px; text-align: left; }
    .approve-btn { background: green; color: white; padding: 5px 10px; border: none; border-radius: 5px; cursor: pointer; }
    .approve-btn:hover { background: darkgreen; }
  </style>
</head>
<body>
  <h1>Blood Donation Management App</h1>
  
  <div class="section">
    <h2>Register as Blood Donor</h2>
    <label>Name: <input id="bd-name"></label>
    <label>Blood Group: 
      <select id="bd-group">
        <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
        <option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
      </select>
    </label>
    <label>Phone: <input id="bd-phone"></label>
    <button onclick="registerBloodDonor()">Register</button>
    <table id="blood-donor-list"><tr><th>Name</th><th>Group</th><th>Phone</th></tr></table>
  </div>

  <div class="section">
    <h2>Search Blood Donor</h2>
    <label>Blood Group:
      <select id="search-group">
        <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
        <option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
      </select>
    </label>
    <button onclick="searchDonor()">Search</button>
    <table id="search-results"><tr><th>Name</th><th>Group</th><th>Phone</th></tr></table>
  </div>

  <div class="section">
    <h2>Register as Money Donor</h2>
    <label>Name: <input id="md-name"></label>
    <label>Phone: <input id="md-phone"></label>
    <label>Bkash/Nagad Number: <input id="md-account"></label>
    <button onclick="registerMoneyDonor()">Register</button>
    <table id="money-donor-list"><tr><th>Name</th><th>Phone</th><th>Account</th></tr></table>
  </div>

  <div class="section">
    <h2>Help Donor Requests</h2>
    <label>Name: <input id="hd-name"></label>
    <label>Phone: <input id="hd-phone"></label>
    <label>Amount Needed: <input id="hd-amount"></label>
    <button onclick="requestHelp()">Request Help</button>
    <table id="help-list"><tr><th>Name</th><th>Phone</th><th>Amount</th><th>Status</th></tr></table>
  </div>

  <script>
    let bloodDonors = JSON.parse(localStorage.getItem("bloodDonors")) || [];
    let moneyDonors = JSON.parse(localStorage.getItem("moneyDonors")) || [];
    let helpRequests = JSON.parse(localStorage.getItem("helpRequests")) || [];

    function saveData() {
      localStorage.setItem("bloodDonors", JSON.stringify(bloodDonors));
      localStorage.setItem("moneyDonors", JSON.stringify(moneyDonors));
      localStorage.setItem("helpRequests", JSON.stringify(helpRequests));
    }

    function render() {
      let bdList = document.getElementById("blood-donor-list");
      bdList.innerHTML = "<tr><th>Name</th><th>Group</th><th>Phone</th></tr>";
      bloodDonors.forEach(d => bdList.innerHTML += `<tr><td>${d.name}</td><td>${d.group}</td><td>${d.phone}</td></tr>`);

      let mdList = document.getElementById("money-donor-list");
      mdList.innerHTML = "<tr><th>Name</th><th>Phone</th><th>Account</th></tr>";
      moneyDonors.forEach(d => mdList.innerHTML += `<tr><td>${d.name}</td><td>${d.phone}</td><td>${d.account}</td></tr>`);

      let hlList = document.getElementById("help-list");
      hlList.innerHTML = "<tr><th>Name</th><th>Phone</th><th>Amount</th><th>Status</th></tr>";
      helpRequests.forEach((h,i) => hlList.innerHTML += `<tr><td>${h.name}</td><td>${h.phone}</td><td>${h.amount}</td><td>${h.status} ${h.status==="Pending" ? `<button class='approve-btn' onclick='approveHelp(${i})'>Approve</button>`:""}</td></tr>`);
    }

    function registerBloodDonor() {
      let donor = { name: bd-name.value, group: bd-group.value, phone: bd-phone.value };
      bloodDonors.push(donor); saveData(); render();
    }

    function searchDonor() {
      let group = search-group.value;
      let results = bloodDonors.filter(d => d.group === group);
      let table = document.getElementById("search-results");
      table.innerHTML = "<tr><th>Name</th><th>Group</th><th>Phone</th></tr>";
      results.forEach(d => table.innerHTML += `<tr><td>${d.name}</td><td>${d.group}</td><td>${d.phone}</td></tr>`);
    }

    function registerMoneyDonor() {
      let donor = { name: md-name.value, phone: md-phone.value, account: md-account.value };
      moneyDonors.push(donor); saveData(); render();
    }

    function requestHelp() {
      let req = { name: hd-name.value, phone: hd-phone.value, amount: hd-amount.value, status: "Pending" };
      helpRequests.push(req); saveData(); render();
    }

    function approveHelp(i) {
      helpRequests[i].status = "Approved"; saveData(); render();
    }

    render();
  </script>
</body>
</html>
